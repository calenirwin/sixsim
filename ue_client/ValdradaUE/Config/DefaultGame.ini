; The packaging settings of ValdradaUE: the lines below belong at the end of ue_client/ValdradaUE/Config/DefaultGame.ini
; (the project's own file; package_linux.sh and package_windows.ps1 refuse to cook without the "; valdrada-packaging"
; marker line). They were proven on a throwaway C++ project with the same engine before being applied here (see
; docs/ue-client-build.md, "Chunks").
;
; Layout: IoStore containers (.utoc/.ucas, plus a small .pak per chunk for the files that are not packages), cooked to
; Saved/Cooked (no Zen store, so the cook output can be measured and deleted), Oodle compressed. Every .ucas is cut into
; partitions of at most 1,900 MB (pakchunkN-<Platform>.ucas, then _s1.ucas, _s2.ucas ...), which the engine mounts as
; one container: each file stays under GitHub's 2 GiB asset limit and Hugging Face's 50 GB file limit without a
; re-assembly step.
;
; What is cooked: the levels the client streams by name (Data/city.json) are not referenced by any package, and the cooker
; finds only .uasset files in DirectoriesToAlwaysCook, never maps; so the maps are primary assets of the type "Map" with the
; cook rule AlwaysCook, a type that must not be editor-only (the asset manager cooks no editor-only type). The folders the
; runtime loads from by path are cooked whole: /Game/Kit and /Game/Lib (the parts the cells' kit tables name),
; /Game/Client (the fleet's meshes, FleetPath, and the client's materials), /Game/Bx (M_bx_film, MPC_r1c), the engine's
; volumetric cloud material and its basic shapes (the stand-ins for walkers, trains and kinds without a mesh); everything
; else is cooked because a level references it.
;
; Chunks (pakchunk<N>): 0 the engine, the client's maps and everything the city shares (material library, textures, kit
; parts, tree library); 1 the 1 km blocks of the near city (/Game/CCB); 2 the far city (/Game/CF). A package that several
; chunks reference goes to chunk 0 by the Priority of the shared rule, so no package is stored twice.
; valdrada-packaging
[/Script/UnrealEd.ProjectPackagingSettings]
UsePakFile=True
bUseIoStore=True
bUseZenStore=False
bCompressed=True
bGenerateChunks=True
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
bSkipEditorContent=True
IncludeDebugFiles=False
IncludeCrashReporter=False
MaxIoStorePartitionSizeMB=1900
+DirectoriesToAlwaysCook=(Path="/Game/Kit")
