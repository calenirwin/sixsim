site_name: SixSim
site_description: >-
  Toronto adaptation of Valdrada: current prototype, source evidence and architecture roadmap.
site_author: Calen Irwin; upstream Valdrada by M. K. Turkcan
repo_url: https://github.com/calenirwin/sixsim
repo_name: calenirwin/sixsim
edit_uri: ""
copyright: Code MIT, documentation CC BY 4.0, compiled city ODbL 1.0. Data © NYC Open Data, NY State open data and OpenStreetMap contributors.

docs_dir: docs
exclude_docs: |
  api/RELEASE_README.md
  techniques.md
  interior-mapping.md
  typology/
  specs/
  hooks/
  overrides/
  assets/figures/raw/
  assets/figures/maps/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    logo: material/city-variant-outline
    repo: fontawesome/brands/github
  favicon: assets/figures/favicon.svg

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/hooks/repo_links.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  links:
    not_found: info
    unrecognized_links: info
    anchors: info

nav:
  - Home: index.md
  - Toronto:
      - Review checkpoint: toronto/review.md
      - Vision and roadmap: toronto/vision.md
      - Data-source register: toronto/data-sources.md
      - Reference audit: toronto/reference-audit.md
      - Decisions needed: toronto/decisions-needed.md
  - Upstream NYC media: media.md
  - Upstream NYC guide:
      - Quick start: quickstart.md
      - Installation: install.md
      - Getting started: api/getting_started.md
      - Data collection: data-collection.md
      - Renderer architecture: architecture.md
      - Rendering in Blender Cycles: blender-cycles.md
      - Rendering in Unreal Engine 5: unreal.md
      - Unreal Engine 5 client: ue-client.md
      - Building the Unreal Engine 5 client: ue-client-build.md
      - Interactive client: client.md
      - Building from source: building.md
      - Development and quality checks: development.md
  - Upstream NYC tutorials:
      - tutorials/index.md
      - First steps: tutorials/first-steps.md
      - Cameras: tutorials/cameras.md
      - Semantic and instance segmentation: tutorials/segmentation.md
      - Depth: tutorials/depth.md
      - Bounding boxes: tutorials/bounding-boxes.md
      - Recording a dataset: tutorials/recording-a-dataset.md
      - Controlling actors: tutorials/controlling-actors.md
  - Upstream API reference:
      - Python API: api/python_api.md
      - Wire protocol: api/protocol.md
  - Data:
      - Licensing: licensing.md
      - Data sources: data-sources.md
      - Acknowledgements: acknowledgements.md
      - Citation: citation.md
